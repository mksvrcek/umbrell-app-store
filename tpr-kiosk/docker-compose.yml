version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: tpr-kiosk_kiosk_1
      APP_PORT: 8080

  kiosk:
    image: debian:bookworm-slim
    restart: on-failure
    stop_grace_period: 5s
    privileged: true
    environment:
      KIOSK_URL: "http://192.168.1.50:3123"
      DEBIAN_FRONTEND: noninteractive
    volumes:
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - ${APP_DATA_DIR}/data:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if ! command -v cage >/dev/null; then
          apt-get update && apt-get install -y --no-install-recommends \
            cage seatd chromium libgl1-mesa-dri fonts-dejavu-core busybox ca-certificates || exit 1
        fi

        # cage refuses to run as root, so use a normal user
        id kiosk >/dev/null 2>&1 || useradd -m -G video,input kiosk
        mkdir -p /tmp/xdg /www /data
        chown kiosk /tmp/xdg && chmod 700 /tmp/xdg
        chown -R kiosk /data

        echo "<h1>HDMI Kiosk</h1><p>Showing: $$KIOSK_URL</p>" > /www/index.html
        busybox httpd -p 8080 -h /www

        # seatd runs as root and hands the screen to the kiosk user
        seatd -g kiosk &
        sleep 2

        while true; do
          su kiosk -s /bin/sh -c "XDG_RUNTIME_DIR=/tmp/xdg LIBSEAT_BACKEND=seatd \
            cage -s -- chromium --kiosk --no-sandbox --ozone-platform=wayland \
            --noerrdialogs --disable-infobars --no-first-run --disable-session-crashed-bubble \
            --user-data-dir=/data/chromium '$$KIOSK_URL'"
          sleep 3
        done