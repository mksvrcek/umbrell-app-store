        // "Can't reach" page: shown instead of Chrome's error page, so the dock
        and settings still work.

        // It keeps checking the page and goes back to it as soon as it answers.

        (function () {
          var params = new URLSearchParams(location.search);
          var url = params.get("url") || "";
          var error = (params.get("error") || "").replace("net::", "");
          var target;
          try { target = new URL(url); } catch (e) { return; }

          var WHY = [
            [/CONNECTION_REFUSED/, "The server isn't accepting connections. It may be switched off or restarting."],
            [/NAME_NOT_RESOLVED|NAME_RESOLUTION|DNS/, "This address couldn't be found on the network."],
            [/INTERNET_DISCONNECTED|NETWORK_CHANGED|ADDRESS_UNREACHABLE|NETWORK_ACCESS/, "This screen can't reach the network right now."],
            [/TIMED_OUT/, "The server is taking too long to answer."],
            [/EMPTY_RESPONSE|CONNECTION_(RESET|CLOSED|ABORTED)/, "The server closed the connection without an answer."]
          ];
          var why = "The page couldn't be loaded.";
          WHY.forEach(function (w) { if (w[0].test(error)) why = w[1]; });

          var el = function (id) { return document.getElementById(id); };
          el("why").textContent = why;
          el("where").textContent = target.host + (error ? " · " + error : "");
          el("title").textContent = target.hostname + " isn't reachable";
          setTile(target.hostname, null, false);

          function setTile(name, icon, full) {
            var tile = el("tile");
            tile.textContent = "";
            tile.className = "tile" + (full ? " full" : "");
            if (icon) {
              var img = document.createElement("img");
              img.alt = "";
              img.src = icon;
              tile.appendChild(img);
              tile.style.background = "";
            } else {
              var h = 0;
              for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
              tile.style.background = "linear-gradient(140deg, hsl(" + h + ",72%,62%), hsl(" + ((h + 40) % 360) + ",70%,46%))";
              tile.textContent = (name.trim()[0] || "?").toUpperCase();
            }
          }

          // Name, icon and buttons from the kiosk's settings
          chrome.runtime.sendMessage({ type: "kiosk-info" }, function (info) {
            void chrome.runtime.lastError;
            if (!info || !info.ok) return;
            var app = info.apps.filter(function (a) {
              try { return new URL(a.url).origin === target.origin; } catch (e) { return false; }
            })[0];
            if (app) {
              el("title").textContent = app.name + " isn't reachable";
              document.title = app.name + " isn't reachable";
              setTile(app.name, app.icon, app.iconFull);
            }
            el("settings").hidden = !info.settings;
            el("hint").hidden = !(info.dock && info.dock.enabled && info.apps.length > 1);
          });

          // Keep trying: every 5 s at first, then less often
          var delay = 5, left = delay, timer = null, busy = false;
          function tick() {
            if (busy) return;
            if (left <= 0) { check(); return; }
            el("status").textContent = "Trying again in " + left + " s";
            left--;
            timer = setTimeout(tick, 1000);
          }
          function check() {
            clearTimeout(timer);
            busy = true;
            el("status").textContent = "Checking…";
            var stop = new AbortController();
            var giveUp = setTimeout(function () { stop.abort(); }, 8000);
            fetch(url, { cache: "no-store", credentials: "include", signal: stop.signal }).then(function () {
              el("status").textContent = "It's back, loading…";
              location.replace(url);
            }, function () {
              clearTimeout(giveUp);
              busy = false;
              delay = Math.min(30, delay + 5);
              left = delay;
              tick();
            });
          }
          el("retry").addEventListener("click", check);
          el("settings").addEventListener("click", function () { chrome.runtime.sendMessage({ type: "kiosk-open-settings" }); });
          window.addEventListener("online", check);
          tick();
        })();

