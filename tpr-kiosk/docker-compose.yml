        def unique_name(cfg, name):
            names = {p["name"].lower() for p in cfg["profiles"]}
            base, n = name, 2
            while name.lower() in names:
                name, n = "%s %d" % (base, n), n + 1
            return name

        def profiles_action(body):
            action, pid = body.get("action"), body.get("id")
            name = str(body.get("name") or "").strip()[:40]

            def change(cfg):
                ps = cfg["profiles"]
                p = next((x for x in ps if x["id"] == pid), None)
                if action == "create":
                    new = json.loads(json.dumps(K.profile(cfg)))
                    new["id"] = K.new_id()
                    new["name"] = unique_name(cfg, name or "New profile")
                    ps.append(new)
                    cfg["active"] = new["id"]
                elif action == "rename" and p and name:
                    p["name"] = name
                elif action == "delete" and p and len(ps) > 1:
                    ps.remove(p)
                elif action == "activate" and p:
                    cfg["active"] = p["id"]
