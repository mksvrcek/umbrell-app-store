            var out = [];
            groupings(p.slice(1)).forEach(function (g) { out.push([p[0]].concat(g)); });
            if (p.length >= 2) {
              groupings(p.slice(2)).forEach(function (g) { out.push([{ col: [p[0], p[1]] }].concat(g)); });
            }
            return out;
          }
          function subsets(rest, size) {
            if (size === 0) return [[]];
            if (rest.length < size) return [];
            var out = [];
            rest.forEach(function (x, k) {
              subsets(rest.slice(k + 1), size - 1).forEach(function (s) { out.push([x].concat(s)); });
            });
            return out;
          }
          // A few useful orders to try (all permutations would be too slow for wide screens)
          function orders(p) {
            var byA = p.slice().sort(function (x, y) { return x.a - y.a; });
            var zig = [];
            var lo = 0, hi = byA.length - 1;
            while (lo <= hi) { zig.push(byA[lo++]); if (lo <= hi) zig.push(byA[hi--]); }
            var land = p.filter(function (x) { return x.a >= 1; }), port = p.filter(function (x) { return x.a < 1; });
            var mixed = [];
            while (land.length || port.length) {
              if (port.length) mixed.push(port.shift());
              if (land.length) mixed.push(land.shift());
              if (land.length) mixed.push(land.shift());
            }
            return [p, byA, byA.slice().reverse(), zig, mixed];
          }

          // Pick the combination that fills the screen best (always includes the first photo)
          function bestLayout(photos, W, H, gap, maxPer) {
            var best = null;
            var first = photos[0], rest = photos.slice(1);
            for (var size = 1; size <= Math.min(maxPer, photos.length); size++) {
              subsets(rest, size - 1).forEach(function (s) {
                orders([first].concat(s)).forEach(function (order) {
                  groupings(order).forEach(function (row) {
                    if (row.length === 1 && row[0].col) return;   // a lone column is never wanted
                    var natural = rowWidth(row, H, gap);
                    var score = Math.abs(Math.log(natural / W)) - 0.03 * (size - 1);   // small nudge towards collages
                    if (!best || score < best.score) best = { row: row, score: score, used: order };
                  });
                });
              });
            }
            return best;
          }

          function buildPage(layout, W, H, gap, margin) {
            var page = document.createElement("div");
            page.className = "slide";
            var row = layout.row;
            var gapsW = gap * (row.length - 1);
            var natural = 0;
            row.forEach(function (p) { natural += pieceWidth(p, H, gap); });
            var scale = (W - gapsW) / natural;      // stretch or squeeze slightly so the row fills the width
            var radius = Math.round(gap * 0.9);
            var x = margin;
            row.forEach(function (p) {
              var w = pieceWidth(p, H, gap) * scale;
              var parts = p.col ? p.col : [p];
              var inv = 0;
              parts.forEach(function (q) { inv += 1 / q.a; });
              var y = margin;
              parts.forEach(function (q) {
                var h = parts.length === 1 ? H : (1 / q.a) / inv * (H - gap * (parts.length - 1));
                var cell = document.createElement("div");
                cell.className = "cell";
                cell.style.left = Math.round(x) + "px";
                cell.style.top = Math.round(y) + "px";
                cell.style.width = Math.round(w) + "px";
                cell.style.height = Math.round(h) + "px";
                cell.style.borderRadius = radius + "px";
                cell.appendChild(q.img);
                page.appendChild(cell);
                y += h + gap;
              });
              x += w + gap;
            });
            return page;
          }

          // Collage off: one photo filling the screen
          function prepareSingle() {
            var item = queue.shift();
            return preload(item).then(function (p) {
              delete cache[item.src];
              if (!p) return null;
              p.img.className = "slide";
              var sa = window.innerWidth / window.innerHeight;
              if (Math.abs(Math.log(p.a / sa)) > 0.25) p.img.classList.add("fit");   // very different shape: show it whole
              return { el: p.img, video: false };
            });
          }

          function preparePhotos() {
            if (!cfg.collage) return prepareSingle();
            // Upcoming photos, up to the next video (fewer for the very first page, so it appears sooner)
            var win = [], maxPer = maxPerPage(), want = first ? Math.min(4, maxPer) : maxPer + 3;
            for (var k = 0; k < queue.length && win.length < want; k++) {
              if (queue[k].type !== "photo") break;
              win.push(queue[k]);
            }
            return Promise.all(win.map(preload)).then(function (loaded) {
              // Drop photos that failed to load
              win.forEach(function (item, k) {
                if (!loaded[k]) {
                  var i = queue.indexOf(item);
                  if (i >= 0) queue.splice(i, 1);
                  delete cache[item.src];
                }
              });
              var photos = loaded.filter(Boolean);
              if (!photos.length) return null;

              var W0 = window.innerWidth, H0 = window.innerHeight;
              var gap = Math.max(6, Math.round(Math.min(W0, H0) * 0.014));
              var W = W0 - gap * 2, H = H0 - gap * 2;
              var layout = bestLayout(photos, W, H, gap, maxPer);
              layout.used.forEach(function (p) {
                var i = queue.indexOf(p.item);
                if (i >= 0) queue.splice(i, 1);
                delete cache[p.item.src];
              });
              return { el: buildPage(layout, W, H, gap, gap), video: false };
            });
          }

          // ---------- Videos: buffered and paused on their first frame until it is their turn ----------

          // Some video servers use a certificate browsers don't accept (Apple's aerial videos do):
          // such a stream is tried again over plain http, and that server is then used over http
          var viaHttp = {};
          function server(u) { try { return new URL(u).host; } catch (e) { return ""; } }
          function plain(u) { return "http:" + u.slice(6); }

          function prepareVideo(item) {
            return new Promise(function (resolve) {
              var el = document.createElement("video"), done = false, t, retried = false;
              var secure = item.stream && /^https:/i.test(item.src);
              el.className = "slide prep";
              el.muted = true; el.playsInline = true; el.preload = "auto";
              function finish(ok) {
                if (done) return; done = true;
                clearTimeout(t);
                if (ok) {
                  if (retried) viaHttp[server(item.src)] = true;
                  resolve({ el: el, video: true, src: item.src });
                  return;
                }
                drop(el); resolve(null);
              }
              el.addEventListener("loadedmetadata", function () {
                var va = el.videoWidth / el.videoHeight, sa = window.innerWidth / window.innerHeight;
                // A very different shape: show it whole (streams always fill the screen)
                if (!item.stream && va && Math.abs(Math.log(va / sa)) > 0.25) el.classList.add("fit");
              });
              el.addEventListener("canplaythrough", function () { finish(true); });
              el.addEventListener("canplay", function () { setTimeout(function () { finish(true); }, 4000); });
              el.addEventListener("error", function () {
                if (secure && !retried) { retried = true; el.src = plain(item.src); return; }
                finish(false);
              });
              t = setTimeout(function () { finish(el.readyState >= 3); }, 45000);
              if (secure && viaHttp[server(item.src)]) { retried = true; el.src = plain(item.src); }
              else el.src = item.src;
              stage.appendChild(el);
            });
          }

          // ---------- Showing them ----------

          function prepare() {
            return topUp().catch(function () {}).then(function () {
              if (!queue.length) return "empty";
              var p = queue[0].type === "video" ? prepareVideo(queue.shift()) : preparePhotos();
              return p.then(function (slide) {
                if (!slide) {
                  // That one could not be loaded: try the next, pausing if nothing loads at all
                  if (++fails < 25) return prepare();
                  fails = 0;
                  return wait(30000).then(prepare);
                }
                fails = 0;
                if (!slide.video) { slide.el.classList.add("prep"); stage.appendChild(slide.el); }
                return slide;
              });
            });
          }

          function show(slide) {
            var el = slide.el, old = current;
            current = slide;
            first = false;
            el.classList.add("show");
            el.classList.remove("prep");
            if (old) {
              old.el.classList.remove("show");
              old.el.classList.add("out");
              setTimeout(function () { drop(old.el); }, 1800);
            }
            if (slide.video) {
              el.muted = !cfg.sound;
              el.addEventListener("ended", function () { if (current === slide) advance(); });
              el.addEventListener("error", function () { if (current === slide) advance(); });
              el.play().catch(function () {
                el.muted = true;
                el.play().catch(function () { if (current === slide) advance(); });
              });
              var secs = isFinite(el.duration) ? el.duration : 600;
              timer = setTimeout(advance, secs * 1000 + 10000);   // safety net if a video gets stuck
            } else {
              timer = setTimeout(advance, cfg.photo * 1000);
            }
          }

          // Time for the next slide. It has (almost always) been getting ready in the background,
          // so it can fade straight in; if not, the current one simply stays up a little longer.
          function advance() {
            if (busy) return;
            busy = true;
            clearTimeout(timer);
            var p = upcoming || prepare();
            upcoming = null;
            p.then(function (slide) {
              busy = false;
              if (slide === "empty") {
                if (!current) msg.textContent = cfg.source === "stream"
                  ? "There are no video links in this profile's screensaver list."
                  : "No photos or videos found in the folders chosen for the screen saver.";
                timer = setTimeout(advance, 30000);
                return;
              }
              msg.textContent = "";
              show(slide);
              upcoming = prepare();
            });
          }

          getJSON("/cgi-bin/settings").catch(function () { return {}; }).then(function (s) {
            for (var k in s) cfg[k] = s[k];
            formats();
            tick();
            clock.hidden = !cfg.clock;
            advance();
          });
        })();

        </script>

        </body>

        </html>
    container_name: tpr-kiosk_kiosk_1
volumes:
  kiosk-usr: null
  kiosk-etc: null
  kiosk-varlib: null
