        <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0
        1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></symbol>

        <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 2v10"/><path
        d="M18.4 6.6a9 9 0 1 1-12.77.04"/></symbol>

        <symbol id="i-play" viewBox="0 0 24 24"><path d="M7
        4v16l13-8z"/></symbol>

        <symbol id="i-remote" viewBox="0 0 24 24"><path d="M13 3H4a2 2 0 0 0-2
        2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-3"/><path d="M8 21h8M12
        17v4"/><path d="m17 8 5-5M17 3h5v5"/></symbol>

        <symbol id="i-ext" viewBox="0 0 24 24"><path d="M15 3h6v6M10 14 21 3M18
        13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>

        <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12"
        r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12"
        r="1"/></symbol>

        <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0
        0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2
        2v2"/></symbol>

        <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11"
        r="8"/><path d="m21 21-4.3-4.3"/></symbol>

        <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12"
        r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20M2
        12h20"/></symbol>

        <symbol id="i-hand" viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-4
        0M14 10V4a2 2 0 0 0-4 0v2M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2
        0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1
        2.83-2.82L7 15"/></symbol>

        <symbol id="i-bksp" viewBox="0 0 24 24"><path d="M10 5a2 2 0 0
        0-1.34.52l-6.33 5.74a1 1 0 0 0 0 1.48l6.33 5.74A2 2 0 0 0 10 19h10a2 2 0
        0 0 2-2V7a2 2 0 0 0-2-2z"/><path d="m12 9 6 6M18 9l-6 6"/></symbol>

        <symbol id="i-shift" viewBox="0 0 24 24"><path d="M9 18v-6H5l7-7 7
        7h-4v6H9z"/></symbol>

