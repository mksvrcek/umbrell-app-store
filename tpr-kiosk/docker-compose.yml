                return None
            lock = _icon_locks.setdefault(path, threading.Lock())
            with lock:
                if os.path.exists(path):
                    return path
                try:
                    final, ctype, body = _get(url, 400000)
                    page = body.decode("utf-8", "replace") if ("html" in ctype or not ctype) else ""
                    candidates = _candidates(final, page)
                except Exception:
                    candidates = _candidates(url, "")
                seen = set()
                for c, full in candidates:
                    if c in seen or len(seen) >= 6:
                        continue
                    seen.add(c)
                    try:
                        if c.startswith("data:"):
