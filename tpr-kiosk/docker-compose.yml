        def _candidates(page_url, page):
            found = []
            for tag in LINK_RE.findall(page[:300000]):
                attrs = {m[0].lower(): html.unescape(m[1] or m[2] or m[3]) for m in ATTR_RE.findall(tag)}
                rel, href = attrs.get("rel", "").lower().split(), attrs.get("href", "").strip()
                if not href or "mask-icon" in rel:
                    continue
                if "apple-touch-icon" in rel or "apple-touch-icon-precomposed" in rel:
                    score = 1000
                elif "icon" in rel:
                    m = re.search(r"(\d+)x\d+", attrs.get("sizes", ""))
                    score = 100 + (min(int(m.group(1)), 512) if m else 0)
                    if "svg" in attrs.get("type", "") or href.lower().split("?")[0].endswith(".svg"):
                        score += 400
                else:
                    continue
                found.append((score, urllib.parse.urljoin(page_url, href)))
            found.sort(key=lambda x: -x[0])
            # (address, whether it is a full-bleed square app icon rather than a small logo)
            return [(u, s >= 1000) for s, u in found] + [(urllib.parse.urljoin(page_url, "/apple-touch-icon.png"), True),
