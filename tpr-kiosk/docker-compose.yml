version: '3.7'
services:
  kiosk:
    image: debian:trixie-slim
    restart: on-failure
    stop_grace_period: 5s
    privileged: true
    network_mode: host
    cpu_shares: 512
    oom_score_adj: 500
    environment:
      KIOSK_AUDIO_CARD: ''
      KIOSK_URL: http://localhost:3123
      SLIDESHOW: 'on'
      SLIDESHOW_FOLDERS: Photos,Videos
      SLIDESHOW_IDLE_SECONDS: '60'
      SLIDESHOW_PHOTO_SECONDS: '20'
      SLIDESHOW_VIDEO_SOUND: 'off'
      DEBIAN_FRONTEND: noninteractive
    volumes:
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - ${APP_DATA_DIR}/data:/data
      - ${UMBREL_ROOT}/home/Photos:/umbrel-home/Photos:ro
      - ${UMBREL_ROOT}/home/Videos:/umbrel-home/Videos:ro
      - ${APP_DATA_DIR}/apt-cache:/var/cache/apt/archives
      - ${APP_DATA_DIR}/apt-lists:/var/lib/apt/lists
      - kiosk-usr:/usr
      - kiosk-etc:/etc
      - kiosk-varlib:/var/lib
    entrypoint:
      - /bin/sh
      - '-c'
    command:
      - >
        PKGS="cage seatd xwayland chromium libgl1-mesa-dri fonts-dejavu-core

        busybox ca-certificates wlr-randr libinput-tools wayvnc novnc websockify

        fonts-inter wlrctl python3 tzdata"

        if ! command -v wayvnc >/dev/null || ! command -v websockify >/dev/null
        \
          || ! fc-list 2>/dev/null | grep -qi "inter" || ! command -v wlrctl >/dev/null \
          || ! command -v python3 >/dev/null || [ ! -e /usr/share/zoneinfo/UTC ]; then
          rm -f /etc/apt/apt.conf.d/docker-clean
          # Faster unpacking on the Pi's storage
          echo 'force-unsafe-io' > /etc/dpkg/dpkg.cfg.d/unsafe-io
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' > /etc/apt/apt.conf.d/keep-cache
          apt-get install -y --no-install-recommends $$PKGS \
            || { apt-get update && apt-get install -y --no-install-recommends $$PKGS; } \
            || exit 1
        fi


        groupadd -f input; groupadd -f render

        id kiosk >/dev/null 2>&1 || useradd -m -G video,input,render kiosk


        # Sound: let the kiosk user use the Pi's sound devices

        if [ -e /dev/snd/controlC0 ]; then
          SND_GID=$$(stat -c %g /dev/snd/controlC0)
          getent group "$$SND_GID" >/dev/null || groupadd -g "$$SND_GID" hostaudio
          usermod -aG "$$(getent group "$$SND_GID" | cut -d: -f1)" kiosk
        fi


        # Send sound to whichever HDMI port the screen is plugged into

        HDMI_CARD=vc4hdmi0

        for st in /sys/class/drm/card*-HDMI-A-2/status; do
          [ "$$(cat "$$st" 2>/dev/null)" = connected ] && HDMI_CARD=vc4hdmi1
        done

        for st in /sys/class/drm/card*-HDMI-A-1/status; do
          [ "$$(cat "$$st" 2>/dev/null)" = connected ] && HDMI_CARD=vc4hdmi0
        done

        [ -n "$$KIOSK_AUDIO_CARD" ] && HDMI_CARD="$$KIOSK_AUDIO_CARD"

        cat > /etc/asound.conf <<EOS

        pcm.!default {
          type plug
          slave.pcm "hdmi:CARD=$$HDMI_CARD,DEV=0"
        }

        ctl.!default {
          type hw
          card $$HDMI_CARD
        }

        EOS

        echo "Sound goes to $$HDMI_CARD"


        # Everything that has to survive a restart lives in /data (the app's
        folder on the Umbrel):

        # the settings and profiles (config.json), app icons and the browser
        profile

        mkdir -p /tmp/xdg /www/cgi-bin /data /opt/kiosk /usr/local/lib/kiosk

        chown kiosk /tmp/xdg && chmod 700 /tmp/xdg

        chown -R kiosk /data

        rm -f /tmp/blank


        # Helper: turn the HDMI output on or off

        cat > /usr/local/bin/kiosk-screen <<'EOS'

        #!/bin/sh

        export XDG_RUNTIME_DIR=/tmp/xdg WAYLAND_DISPLAY=wayland-0

        for o in $$(wlr-randr | grep -v '^ ' | cut -d' ' -f1); do
          wlr-randr --output "$$o" --$$1
        done

        EOS

        chmod +x /usr/local/bin/kiosk-screen



        # ---------- Settings: kept in /data/config.json, edited on the settings
        page (port 5782) ----------


        cat > /usr/local/lib/kiosk/kioskconf.py <<'EOS'

        """Kiosk settings, kept in one JSON file on the app's data volume, plus
        helpers

        that drive the browser. Used by the settings server, the screen saver
        and the

        small CGI scripts."""

        import datetime, hashlib, hmac, json, math, os, re, secrets, sys, time,
        uuid, urllib.parse, urllib.request


        try:
            import fcntl
        except ImportError:   # only when testing away from the Pi
            fcntl = None

        DATA = os.environ.get("KIOSK_DATA", "/data")

        MEDIA = os.environ.get("KIOSK_MEDIA", "/umbrel-home")

        PATH = os.path.join(DATA, "config.json")

        LAST_INPUT = "/tmp/last-input"

        CDP = os.environ.get("KIOSK_CDP", "http://127.0.0.1:9222")

        SAVER_URL = "http://localhost:5783/slideshow.html"

        SETTINGS_PORT = 5782


        ZONEINFO = os.environ.get("KIOSK_ZONEINFO", "/usr/share/zoneinfo")


        MEDIA_ROOTS = ("Photos", "Videos")

        PHOTO_EXT = {".jpg", ".jpeg", ".png", ".webp", ".gif", ".avif", ".bmp"}

        VIDEO_EXT = {".mp4", ".m4v", ".mov", ".webm"}



        # ---------- Defaults (the compose settings only seed the very first
        start) ----------


        def _env(name, default):
            return os.environ.get(name, "") or default

        def new_id():
            return uuid.uuid4().hex[:8]

        def _int(v, lo, hi, default):
            try:
                v = int(float(v))
            except (TypeError, ValueError):
                return default
            return max(lo, min(hi, v))

        def _bool(v, default):
            return v if isinstance(v, bool) else default

        def _hex(v, length):
            v = str(v or "")
            return v if len(v) == length and all(c in "0123456789abcdef" for c in v) else ""

        def default_profile(name="Default"):
            app = {"id": new_id(), "name": "Dashboard", "url": _env("KIOSK_URL", "http://localhost:3123")}
            folders = [clean_rel(f) for f in _env("SLIDESHOW_FOLDERS", "Photos,Videos").split(",")]
            return {
                "id": new_id(),
                "name": name,
                "apps": [app],
                "home": app["id"],
                "dock": {"enabled": True, "timeout": 20},
                "saver": {
                    "enabled": _env("SLIDESHOW", "on") != "off",
                    "idle": _int(_env("SLIDESHOW_IDLE_SECONDS", "60"), 5, 86400, 60),
                    "photo": _int(_env("SLIDESHOW_PHOTO_SECONDS", "20"), 2, 3600, 20),
                    "sound": _env("SLIDESHOW_VIDEO_SOUND", "off") == "on",
                    "clock": True,
                    "collage": True,
                    "returnHome": True,
                    "include": [f for f in folders if valid_rule(f)],
                    "exclude": [],
                    "source": "local",      # "local": Photos & Videos folders, "stream": the list of video links below
                    "streams": "",
                    "sun": True,            # day/night by sunrise and sunset; otherwise the two times below
                    "dayStart": 7 * 60,
                    "nightStart": 19 * 60,
                },
            }

        def initial():
            p = default_profile()
            tz = _env("TZ", "")
            return {"version": 1, "rev": 0, "timezone": tz if valid_tz(tz) else "",
                    "clock24": True, "kioskSettings": True, "pinKiosk": False, "pinUmbrel": False,
                    "active": p["id"], "profiles": [p]}


        # ---------- Cleaning up whatever gets saved ----------


        def clean_url(u):
            u = str(u or "").strip()
            if u and not re.match(r"^[a-zA-Z][a-zA-Z0-9+.-]*:", u):
                u = "http://" + u
            return u[:2000]

        def clean_rel(path):
            parts = [p for p in str(path or "").replace("\\", "/").split("/") if p not in ("", ".", "..")]
            return "/".join(parts)

        def valid_rule(rel):
            return bool(rel) and rel.split("/")[0] in MEDIA_ROOTS

        def valid_tz(tz):
            return tz == "" or bool(re.match(r"^[A-Za-z0-9_+-]+(/[A-Za-z0-9_+-]+)*$$", tz or ""))

        def _rules(v, default):
            if not isinstance(v, list):
                return list(default)
            out = []
            for r in v:
                r = clean_rel(r)
                if valid_rule(r) and r not in out:
                    out.append(r)
            return out

        def normalize_profile(p):
            d = default_profile()
            apps, ids = [], set()
            for a in p.get("apps") or []:
                if not isinstance(a, dict) or not clean_url(a.get("url")):
                    continue
                url = clean_url(a["url"])
                aid = re.sub(r"[^A-Za-z0-9_-]", "", str(a.get("id") or ""))[:32] or new_id()
                while aid in ids:
                    aid = new_id()
                ids.add(aid)
                name = str(a.get("name") or "").strip()[:60] or (urllib.parse.urlsplit(url).hostname or url)
                apps.append({"id": aid, "name": name, "url": url, "pin": _bool(a.get("pin"), False)})
            if not apps:
                apps = d["apps"]
            home = p.get("home") if p.get("home") in [a["id"] for a in apps] else apps[0]["id"]
            dock, saver, ds = p.get("dock") or {}, p.get("saver") or {}, d["saver"]
            include = _rules(saver.get("include"), ds["include"])
            exclude = [r for r in _rules(saver.get("exclude"), []) if r not in include]
            return {
                "id": re.sub(r"[^A-Za-z0-9_-]", "", str(p.get("id") or ""))[:32] or new_id(),
                "name": str(p.get("name") or "").strip()[:40] or "Profile",
                "apps": apps,
                "home": home,
                "dock": {"enabled": _bool(dock.get("enabled"), True),
                         "timeout": _int(dock.get("timeout"), 3, 3600, 20)},
                "saver": {
                    "enabled": _bool(saver.get("enabled"), ds["enabled"]),
                    "idle": _int(saver.get("idle"), 5, 86400, ds["idle"]),
                    "photo": _int(saver.get("photo"), 2, 3600, ds["photo"]),
                    "sound": _bool(saver.get("sound"), ds["sound"]),
                    "clock": _bool(saver.get("clock"), True),
                    "collage": _bool(saver.get("collage"), True),
                    "returnHome": _bool(saver.get("returnHome"), True),
                    "include": include,
                    "exclude": exclude,
                    "source": "stream" if saver.get("source") == "stream" else "local",
                    "streams": str(saver.get("streams") or "").replace("\r\n", "\n")[:50000],
                    "sun": _bool(saver.get("sun"), True),
                    "dayStart": _int(saver.get("dayStart"), 0, 1439, ds["dayStart"]),
                    "nightStart": _int(saver.get("nightStart"), 0, 1439, ds["nightStart"]),
                },
            }

        def normalize(cfg):
            if not isinstance(cfg, dict):
                cfg = {}
            tz = str(cfg.get("timezone") or "")
            out = {
                "version": 1,
                "rev": _int(cfg.get("rev"), 0, 10 ** 12, 0),
                "timezone": tz if valid_tz(tz) else "",
                "clock24": _bool(cfg.get("clock24"), True),
                "kioskSettings": _bool(cfg.get("kioskSettings"), True),
                # One PIN for the whole kiosk, kept only as a salted hash
                "pinSalt": _hex(cfg.get("pinSalt"), 16),
                "pinHash": _hex(cfg.get("pinHash"), 64),
                "pinKiosk": _bool(cfg.get("pinKiosk"), False),
                "pinUmbrel": _bool(cfg.get("pinUmbrel"), False),
            }
            if not (out["pinSalt"] and out["pinHash"]):
                out["pinSalt"] = out["pinHash"] = ""
            profiles, seen = [], set()
            for p in cfg.get("profiles") or []:
                if isinstance(p, dict):
                    p = normalize_profile(p)
                    while p["id"] in seen:
                        p["id"] = new_id()
                    seen.add(p["id"])
                    profiles.append(p)
            if not profiles:
                profiles = [default_profile()]
            out["profiles"] = profiles
            ids = [p["id"] for p in profiles]
            out["active"] = cfg.get("active") if cfg.get("active") in ids else ids[0]
            return out


        # ---------- Reading and writing (atomic, so a power cut never leaves
        half a file) ----------


        class _Lock:
            def __enter__(self):
                os.makedirs(DATA, exist_ok=True)
                self.f = open(os.path.join(DATA, ".config.lock"), "a")
                if fcntl:
                    fcntl.flock(self.f, fcntl.LOCK_EX)
                return self

            def __exit__(self, *exc):
                if fcntl:
                    fcntl.flock(self.f, fcntl.LOCK_UN)
                self.f.close()

        def _save(cfg):
            tmp = "%s.%d.tmp" % (PATH, os.getpid())
            with open(tmp, "w") as f:
                json.dump(cfg, f, indent=1)
                f.flush()
                os.fsync(f.fileno())
            os.replace(tmp, PATH)

        def _read():
            with open(PATH) as f:
                return json.load(f)

        def load():
            try:
                return normalize(_read())
            except (OSError, ValueError):
                pass
            with _Lock():
                try:
                    return normalize(_read())
                except FileNotFoundError:
                    cfg = normalize(initial())
                except (OSError, ValueError):
                    # Keep a copy of a damaged file, then start again from the defaults
                    try:
                        os.replace(PATH, PATH + ".broken")
                    except OSError:
                        pass
                    cfg = normalize(initial())
                _save(cfg)
                return cfg

        def update(change):
            """Run change(cfg) on the current settings and save the result."""
            with _Lock():
                try:
                    cfg = normalize(_read())
                except (OSError, ValueError):
                    cfg = normalize(initial())
                change(cfg)
                cfg = normalize(cfg)
                cfg["rev"] += 1
                _save(cfg)
                return cfg

        def profile(cfg):
            return next((p for p in cfg["profiles"] if p["id"] == cfg["active"]), cfg["profiles"][0])

        def home_app(cfg):
            p = profile(cfg)
            return next(a for a in p["apps"] if a["id"] == p["home"])

        def home_url(cfg):
            return home_app(cfg)["url"]


        # ---------- PIN ----------


        def valid_pin(pin):
            return isinstance(pin, str) and len(pin) == 6 and pin.isdigit() and pin.isascii()

        def _pin_hash(pin, salt):
            return hashlib.sha256((salt + ":" + pin).encode()).hexdigest()

        def set_pin(cfg, pin):
            """Set (6 digits) or remove (None) the PIN on a settings dict."""
            if pin is None:
                cfg["pinSalt"] = cfg["pinHash"] = ""
                cfg["pinKiosk"] = cfg["pinUmbrel"] = False
            else:
                cfg["pinSalt"] = secrets.token_hex(8)
                cfg["pinHash"] = _pin_hash(pin, cfg["pinSalt"])

        def check_pin(cfg, pin):
            return bool(cfg.get("pinHash")) and valid_pin(pin) and \
                hmac.compare_digest(_pin_hash(pin, cfg["pinSalt"]), cfg["pinHash"])

        def public(cfg):
            """The settings as sent to browsers: never the PIN itself."""
            out = {k: v for k, v in cfg.items() if k not in ("pinHash", "pinSalt")}
            out["pinSet"] = bool(cfg.get("pinHash"))
            return out


        # ---------- Video streams for the screen saver, by day or by night
        ----------


        STREAM_RE =
        re.compile(r"^(?:([DdNn])\s*[-:|\u2013]?\s+)?(https?://\S+)$$")


        def parse_streams(text):
            """Lines of "D - <url>" (day), "N - <url>" (night) or just "<url>" (any time)."""
            out = []
            for line in str(text or "").splitlines():
                line = line.strip()
                if not line or line.startswith("#"):
                    continue
                m = STREAM_RE.match(line)
                if m:
                    out.append(((m.group(1) or "").upper(), m.group(2)))
            return out

        def _tz(cfg):
            try:
                import zoneinfo
                return zoneinfo.ZoneInfo(cfg.get("timezone") or "UTC")
            except Exception:
                return datetime.timezone.utc

        def zone_place(tz_name):
            """(latitude, longitude, city) of a time zone's main city, from the system's time zone data."""
            for name in ("zone1970.tab", "zone.tab"):
                try:
                    with open(os.path.join(ZONEINFO, name), encoding="utf-8") as f:
                        for line in f:
                            parts = line.rstrip("\n").split("\t")
                            if line.startswith("#") or len(parts) < 3 or parts[2] != tz_name:
                                continue
                            m = re.fullmatch(r"([+-])(\d{2})(\d{2})(\d{2})?([+-])(\d{3})(\d{2})(\d{2})?", parts[1])
                            if not m:
                                return None
                            lat = (int(m.group(2)) + int(m.group(3)) / 60 + int(m.group(4) or 0) / 3600) * (1 if m.group(1) == "+" else -1)
                            lon = (int(m.group(6)) + int(m.group(7)) / 60 + int(m.group(8) or 0) / 3600) * (1 if m.group(5) == "+" else -1)
                            return lat, lon, tz_name.split("/")[-1].replace("_", " ")
                except OSError:
                    continue
            return None

        def sun_times(day, lat, lon):
            """Sunrise and sunset (unix time) on a date, or "day"/"night" when the sun doesn't set or rise."""
            n = (day - datetime.date(2000, 1, 1)).days + 0.0008
            j = n - lon / 360
            m = math.radians((357.5291 + 0.98560028 * j) % 360)
            c = 1.9148 * math.sin(m) + 0.02 * math.sin(2 * m) + 0.0003 * math.sin(3 * m)
            lam = math.radians((math.degrees(m) + c + 180 + 102.9372) % 360)
            transit = 2451545.0 + j + 0.0053 * math.sin(m) - 0.0069 * math.sin(2 * lam)
            dec = math.asin(math.sin(lam) * math.sin(math.radians(23.4397)))
            phi = math.radians(lat)
            cos_w = (math.sin(math.radians(-0.833)) - math.sin(phi) * math.sin(dec)) / (math.cos(phi) * math.cos(dec))
            if cos_w < -1:
                return "day"
            if cos_w > 1:
                return "night"
            w = math.degrees(math.acos(cos_w)) / 360
            return (transit - w - 2440587.5) * 86400, (transit + w - 2440587.5) * 86400

        def day_or_night(cfg, saver, now=None):
            """Whether it is night now, when that changes next, and how that was decided."""
            now = now or time.time()
            local = datetime.datetime.fromtimestamp(now, _tz(cfg))
            place = zone_place(cfg.get("timezone") or "") if saver["sun"] else None
            if place:
                lat, lon, city = place
                today = sun_times(local.date(), lat, lon)
                if isinstance(today, tuple):
                    rise, sset = today
                    if now < rise:
                        return {"night": True, "until": rise, "mode": "sun", "place": city, "rise": rise, "set": sset}
                    if now < sset:
                        return {"night": False, "until": sset, "mode": "sun", "place": city, "rise": rise, "set": sset}
                    nxt = sun_times(local.date() + datetime.timedelta(days=1), lat, lon)
                    until = nxt[0] if isinstance(nxt, tuple) else now + 3600
                    return {"night": True, "until": until, "mode": "sun", "place": city, "rise": rise, "set": sset}
                # Midnight sun or polar night: look again in an hour
                return {"night": today == "night", "until": now + 3600, "mode": "sun", "place": city}
            # Fixed times (also when the time zone has no known place, like UTC)
            day_m, night_m = saver["dayStart"], saver["nightStart"]
            mins = local.hour * 60 + local.minute
            night = not (day_m <= mins < night_m) if day_m < night_m else (night_m <= mins < day_m)
            midnight = local.replace(hour=0, minute=0, second=0, microsecond=0)
            times = [(midnight + datetime.timedelta(days=d, minutes=m)).timestamp() for d in (0, 1) for m in (day_m, night_m)]
            until = min([t for t in times if t > now] or [now + 3600])
            return {"night": night, "until": until, "mode": "fixed"}

        def saver_settings(cfg):
            """What the screen saver page needs to know."""
            s = profile(cfg)["saver"]
            return {"photo": s["photo"], "sound": s["sound"], "clock": s["clock"], "collage": s["collage"],
                    "source": s["source"], "clock24": cfg["clock24"], "timezone": cfg["timezone"]}

        def saver_items(cfg, now=None):
            """The screen saver's playlist: files from the chosen folders, or the video streams for
            this time of day (any-time links always; if a period has no links of its own, all of them)."""
            s = profile(cfg)["saver"]
            if s["source"] != "stream":
                return list_media(s["include"], s["exclude"])
            dn = day_or_night(cfg, s, now)
            links = parse_streams(s["streams"])
            want = "N" if dn["night"] else "D"
            chosen = [u for k, u in links if k in ("", want)] or [u for _, u in links]
            return {"items": [{"type": "video", "src": u, "stream": True} for u in chosen],
                    "until": int(dn["until"] * 1000), "night": dn["night"]}


        # ---------- Which photos and videos the screen saver uses ----------

        # Folders are switched on or off as a whole, and the closest setting
        wins:

        # with "Photos" on and "Photos/Screenshots" off, everything but the
        screenshots is shown.


        def included(rel, include, exclude):
            best, length = False, -1
            for rules, value in ((include, True), (exclude, False)):
                for r in rules:
                    if (rel == r or rel.startswith(r + "/")) and len(r) > length:
                        best, length = value, len(r)
            return best

        def media_kind(name):
            ext = os.path.splitext(name)[1].lower()
            return "photo" if ext in PHOTO_EXT else "video" if ext in VIDEO_EXT else None

        def list_media(include, exclude):
            items = []
            for top in MEDIA_ROOTS:
                if not any(r == top or r.startswith(top + "/") for r in include):
                    continue
                base = os.path.join(MEDIA, top)
                for dirpath, dirnames, filenames in os.walk(base):
                    rel_dir = os.path.relpath(dirpath, MEDIA).replace(os.sep, "/")
                    keep = []
                    for d in sorted(dirnames):
                        child = rel_dir + "/" + d
                        if not d.startswith(".") and (included(child, include, exclude)
                                                      or any(r.startswith(child + "/") for r in include)):
                            keep.append(d)
                    dirnames[:] = keep
                    if not included(rel_dir, include, exclude):
                        continue
                    for name in filenames:
                        kind = not name.startswith(".") and media_kind(name)
                        if kind:
                            rel = rel_dir + "/" + name
                            items.append({"type": kind, "src": "/media/" + urllib.parse.quote(rel)})
            return items

        def _scan(path, rel):
            node = {"name": rel.split("/")[-1], "path": rel, "photos": 0, "videos": 0, "children": []}
            try:
                entries = sorted(os.scandir(path), key=lambda e: e.name.lower())
            except OSError:
                return node
            for e in entries:
                if e.name.startswith("."):
                    continue
                try:
                    if e.is_dir(follow_symlinks=False):
                        child = _scan(e.path, rel + "/" + e.name)
                        if child["total"]:
                            node["children"].append(child)
                    elif e.is_file():
                        kind = media_kind(e.name)
                        if kind:
                            node[kind + "s"] += 1
                except OSError:
                    pass
            node["total"] = node["photos"] + node["videos"] + sum(c["total"] for c in node["children"])
            return node

        def folder_tree():
            return [_scan(os.path.join(MEDIA, top), top) for top in MEDIA_ROOTS
                    if os.path.isdir(os.path.join(MEDIA, top))]


        # ---------- The browser, through its local control port ----------


        def cdp(path, method="GET"):
            req = urllib.request.Request(CDP + path, method=method)
            with urllib.request.urlopen(req, timeout=3) as r:
                body = r.read()
