        6-6"/></symbol>

        <symbol id="i-lock" viewBox="0 0 24 24"><rect x="3" y="11" width="18"
        height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>

        </defs></svg>

        <div class="bg"></div>

        <main class="wrap">
          <header class="top">
            <div class="brand">
              <div class="logo"><svg class="i"><use href="#i-monitor"/></svg></div>
              <div class="grow">
                <h1>Kiosk</h1>
                <div class="status" id="status"><span class="dot"></span><span>Connecting…</span></div>
              </div>
            </div>
            <div class="top-actions">
              <button class="btn" id="remoteBtn" data-action="remote"><svg class="i"><use href="#i-remote"/></svg><span>Remote<span class="long"> control</span></span></button>
              <button class="btn primary hidden" id="doneBtn" data-action="done">Done</button>
            </div>
          </header>

          <section class="card profiles" id="profiles"></section>

          <div class="cols">
            <div class="col">
              <section class="card" id="apps" style="--o:1"></section>
              <section class="card" id="dock" style="--o:4"></section>
              <section class="card" id="time" style="--o:5"></section>
            </div>
            <div class="col">
              <section class="card" id="saver" style="--o:2"></section>
              <section class="card" id="folders" style="--o:3"></section>
              <section class="card" id="device" style="--o:6"></section>
              <section class="card" id="pin" style="--o:7"></section>
            </div>
          </div>
          <p class="foot">Changes are saved straight away</p>
        </main>


        <div class="sheet-wrap" id="sheet" hidden>
          <div class="backdrop" data-action="sheet-close"></div>
          <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
            <div class="sheet-head">
              <h2 id="sheetTitle"></h2>
              <button class="icon-btn" data-action="sheet-close" aria-label="Close"><svg class="i"><use href="#i-x"/></svg></button>
            </div>
            <div class="sheet-body" id="sheetBody"></div>
            <div class="sheet-foot" id="sheetFoot"></div>
          </div>
        </div>


        <div class="remote" id="remote" hidden>
          <div class="remote-bar">
            <button class="btn quiet" data-action="remote-close"><svg class="i"><use href="#i-back"/></svg>Settings</button>
            <div class="title">Remote control</div>
            <a class="btn quiet" id="remoteTab" target="_blank" rel="noopener">New tab<svg class="i"><use href="#i-ext"/></svg></a>
          </div>
          <iframe id="remoteFrame" title="Remote control" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
        </div>


        <div class="lockscreen" id="lockscreen" hidden>
          <div class="lock-inner">
            <div class="logo"><svg class="i"><use href="#i-lock"/></svg></div>
            <div id="lockPad"></div>
            <button class="btn quiet kiosk-only" data-action="done">Close</button>
          </div>
        </div>


        <div class="toast" id="toast" role="status" aria-live="polite"></div>

        <div class="osk" id="osk" aria-hidden="true"></div>

        <script>

        (function () {
          "use strict";
          // Opened on the kiosk itself (by the swipe from the top-right corner)?
          var KIOSK = /[?&]kiosk\b/.test(location.search);
          if (KIOSK) document.documentElement.classList.add("kiosk");

          var S = { cfg: null, status: {}, icons: {}, tree: null, treeLoading: false, open: { Photos: true, Videos: true }, dragging: false };
          var ACTIONS = {};
          var HALF_HOURS = [];
          for (var hh = 0; hh < 1440; hh += 30) HALF_HOURS.push(hh);
          var STEPS = {
            "saver.dayStart": HALF_HOURS,
            "saver.nightStart": HALF_HOURS,
            "saver.idle": [15, 30, 45, 60, 90, 120, 180, 300, 600, 900, 1200, 1800, 2700, 3600],
            "saver.photo": [3, 5, 8, 10, 12, 15, 20, 25, 30, 45, 60, 90, 120],
            "dock.timeout": [5, 8, 10, 15, 20, 30, 45, 60, 90, 120]
          };

          // ---------- Helpers ----------

          function qs(sel, root) { return (root || document).querySelector(sel); }
          function qsa(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
          function esc(s) {
            return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
              return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
            });
          }
          function ic(name, cls) { return '<svg class="i' + (cls ? " " + cls : "") + '" aria-hidden="true"><use href="#i-' + name + '"/></svg>'; }
          function plural(n, word) { return n.toLocaleString("en-US") + " " + word + (n === 1 ? "" : "s"); }
          function clone(o) { return JSON.parse(JSON.stringify(o)); }
          function hue(text) { var n = 0; for (var i = 0; i < text.length; i++) n = (n * 31 + text.charCodeAt(i)) % 360; return n; }
          function hostOf(u) { try { return new URL(u).hostname; } catch (e) { return u; } }
          function prettyUrl(u) { return u.replace(/^https?:\/\//, "").replace(/\/$$/, ""); }
          function newId() { return Math.random().toString(16).slice(2, 10); }
          function dur(s) {
            if (s < 60) return s + " s";
            if (s < 3600) return Math.round(s / 6) / 10 + " min";
            return Math.round(s / 360) / 10 + " h";
          }
          function nearest(list, v) {
            var best = 0;
            list.forEach(function (x, k) { if (Math.abs(x - v) < Math.abs(list[best] - v)) best = k; });
            return best;
          }

          // With a PIN on the settings, the server hands out a token once the PIN is entered
          var token = "";
          try { token = sessionStorage.getItem("kioskToken") || ""; } catch (e) {}
          function api(method, path, body) {
            var headers = {};
            if (body) headers["Content-Type"] = "application/json";
            if (token) headers["X-Kiosk-Token"] = token;
            return fetch(path, {
              method: method, cache: "no-store", headers: headers,
              body: body ? JSON.stringify(body) : undefined
            }).then(function (r) {
              var t = r.headers.get("X-Kiosk-Token");
              if (t) { token = t; try { sessionStorage.setItem("kioskToken", t); } catch (e) {} }
              return r.json().catch(function () { return {}; }).then(function (j) {
                if (r.status === 401 && j.locked) {
                  showLockScreen();
                  var locked = new Error("locked");
                  locked.locked = true;
                  throw locked;
                }
                if (!r.ok || j.error) {
                  var err = new Error(j.error || "HTTP " + r.status);
                  err.data = j;
                  throw err;
                }
                return j;
              });
            });
          }

          var toastTimer;
          function toast(text, isError) {
            var t = qs("#toast");
            t.innerHTML = ic(isError ? "alert" : "check") + "<span>" + esc(text) + "</span>";
            t.className = "toast show" + (isError ? " error" : "");
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function () { t.className = "toast" + (isError ? " error" : ""); }, isError ? 4500 : 2200);
          }
          function fail(e) {
            if (e && e.locked) return;
            toast("Couldn't save: " + ((e && e.message) || "no connection"), true);
            load(true);
          }

          function profile() {
            var c = S.cfg;
            return c.profiles.filter(function (p) { return p.id === c.active; })[0] || c.profiles[0];
          }
          function getKey(key) {
            var k = key.split(".");
            return k[0] === "g" ? S.cfg[k[1]] : profile()[k[0]][k[1]];
          }
          function setKey(key, val, delay) {
            var k = key.split("."), part = {};
            if (k[0] === "g") {
              S.cfg[k[1]] = val;
              part[k[1]] = val;
              save({ global: part }, delay);
            } else {
              profile()[k[0]][k[1]] = val;
              part[k[0]] = {};
              part[k[0]][k[1]] = val;
              save({ profile: part }, delay);
            }
          }

          // ---------- Saving: shown here straight away, sent to the kiosk a moment later ----------

          var queued = null, saveTimer = null;
          function save(change, delay) {
            queued = queued || { global: {}, profile: {} };
            Object.keys(change.global || {}).forEach(function (k) { queued.global[k] = change.global[k]; });
            var pc = change.profile || {};
            Object.keys(pc).forEach(function (k) {
              if (k === "dock" || k === "saver") queued.profile[k] = Object.assign(queued.profile[k] || {}, pc[k]);
              else queued.profile[k] = pc[k];
            });
            clearTimeout(saveTimer);
            saveTimer = setTimeout(flush, delay || 0);
          }
          function same(a, b) {
            return JSON.stringify(Object.assign({}, a, { rev: 0 })) === JSON.stringify(Object.assign({}, b, { rev: 0 }));
          }
          function flush() {
            clearTimeout(saveTimer);
            var body = queued;
            queued = null;
            if (!body) return Promise.resolve(S.cfg);
            return api("PUT", "/api/settings", body).then(function (cfg) {
              if (queued) { S.cfg.rev = cfg.rev; return cfg; }   // newer changes are on their way
              var changed = !same(cfg, S.cfg);
              S.cfg = cfg;
              if (changed && !S.dragging) render();
              toast("Saved");
              return cfg;
            }, function (e) { fail(e); throw e; });
          }
          // Run something once any unsaved change has reached the kiosk
          function afterSave(fn) { return flush().then(fn); }

          function typing() {
            var a = document.activeElement;
            return !!a && (a.tagName === "TEXTAREA" || (a.tagName === "INPUT" && a.type !== "range"));
          }
          function load(force) {
            return api("GET", "/api/state").then(function (st) {
              S.status = st.status || {};
              S.icons = st.icons || {};
              var dn = JSON.stringify(st.daynight || null), dnChanged = dn !== S.dnKey;
              S.daynight = st.daynight;
              S.dnKey = dn;
              var fresh = !S.cfg || st.config.rev !== S.cfg.rev;
              if (force || (fresh && !queued && !S.dragging && !typing())) { S.cfg = st.config; render(); }
              else {
                renderStatus();
                if (dnChanged && S.cfg && !typing()) renderSaver();
              }
            }, function (e) { if (!(e && e.locked)) renderStatus(true); });
          }

          function loadTree(refresh) {
            S.treeLoading = true;
            renderFolders();
            return api("GET", "/api/folders" + (refresh ? "?refresh=1" : "")).then(function (t) {
              t.forEach(sums);
              S.tree = t;
            }, function (e) {
              S.tree = S.tree || (e && e.locked ? null : []);
              if (!(e && e.locked)) toast("Couldn't read your folders", true);
            }).then(function () { S.treeLoading = false; renderFolders(); });
          }
          function sums(n) {
            n.tp = n.photos; n.tv = n.videos;
            n.children.forEach(function (c) { sums(c); n.tp += c.tp; n.tv += c.tv; });
          }

          // ---------- Building blocks ----------

          function head(icon, title, sub, extra) {
            return '<div class="card-head"><div class="card-icon">' + ic(icon) + '</div><div class="grow"><div class="card-title">' +
              esc(title) + '</div>' + (sub ? '<div class="card-sub">' + esc(sub) + '</div>' : "") + '</div>' + (extra || "") + '</div>';
          }
          function switchEl(key, label) {
            return '<button class="switch" role="switch" aria-checked="' + !!getKey(key) + '" data-switch="' + key + '" aria-label="' + esc(label) + '"></button>';
          }
          function toggleRow(key, label, desc, first) {
            return '<div class="row toggle' + (first ? " first" : "") + '" data-toggle="' + key + '"><div class="grow"><div class="label">' + esc(label) + '</div>' +
              (desc ? '<div class="desc">' + esc(desc) + '</div>' : "") + '</div>' +
              '<button class="switch" role="switch" aria-checked="' + !!getKey(key) + '" aria-label="' + esc(label) + '"></button></div>';
          }
          function clockTime(mins) {
            var h = Math.floor(mins / 60), m = mins % 60, mm = (m < 10 ? "0" : "") + m;
            if (S.cfg.clock24) return (h < 10 ? "0" : "") + h + ":" + mm;
            return ((h + 11) % 12 + 1) + ":" + mm + (h < 12 ? " AM" : " PM");
          }
          function fmtOf(key) { return /dayStart|nightStart/.test(key) ? clockTime : dur; }
          function sliderRow(key, label) {
            var steps = STEPS[key], v = getKey(key), idx = nearest(steps, v), f = fmtOf(key);
            return '<div class="slider"><div class="slider-head"><div class="label">' + esc(label) + '</div>' +
              '<div class="value" data-value="' + key + '">' + f(v) + '</div></div>' +
              '<input type="range" min="0" max="' + (steps.length - 1) + '" step="1" value="' + idx + '" data-slider="' + key + '"' +
              ' style="--fill:' + (idx / (steps.length - 1) * 100) + '%" aria-label="' + esc(label) + '">' +
              '<div class="scale"><span>' + f(steps[0]) + '</span><span>' + f(steps[steps.length - 1]) + '</span></div></div>';
          }
          function tile(app) {
            var kind = S.icons[app.url];
            if (kind) {
              return '<div class="tile' + (kind === "full" ? " full" : "") + '"><img alt="" src="/api/icon?url=' + encodeURIComponent(app.url) + '"></div>';
            }
            var h = hue(app.name);
            return '<div class="tile" style="background:linear-gradient(140deg,hsl(' + h + ',72%,62%),hsl(' + (h + 40) % 360 + ',70%,46%))">' +
              esc((app.name.trim()[0] || "?").toUpperCase()) + '</div>';
          }
          function action(name, label, icon) {
            return '<button class="action" data-action="' + name + '">' + ic(icon) + '<span>' + esc(label) + '</span></button>';
          }

          // ---------- Time ----------

          var fmts = {};
          function fmt(tz, opts, locale) {
            var key = tz + JSON.stringify(opts);
            if (!fmts[key]) {
              try { fmts[key] = new Intl.DateTimeFormat(locale || "en-GB", Object.assign({ timeZone: tz || "UTC" }, opts)); }
              catch (e) { fmts[key] = new Intl.DateTimeFormat(locale || "en-GB", opts); }
            }
            return fmts[key];
          }
          function fmtTime(d, tz, h24) {
            return h24 ? fmt(tz, { hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).format(d)
                       : fmt(tz, { hour: "numeric", minute: "2-digit", hour12: true }, "en-US").format(d);
          }
          function offset(d, tz) {
            try {
              var part = fmt(tz, { timeZoneName: "shortOffset" }, "en-US").formatToParts(d).filter(function (p) { return p.type === "timeZoneName"; })[0];
              return part ? part.value.replace("GMT", "UTC") : "";
            } catch (e) { return ""; }
          }
          function deviceTz() { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) { return ""; } }
          function city(tz) { var p = tz.split("/"); return p[p.length - 1].replace(/_/g, " "); }
          function area(tz) { return tz.split("/").slice(0, -1).join(" / ").replace(/_/g, " "); }
          function tzLabel(tz) { return !tz || tz === "UTC" ? "UTC" : city(tz) + (area(tz) ? " · " + area(tz) : ""); }
          function tickNow() {
            var a = qs("#nowTime"), b = qs("#nowDate");
            if (!a || !S.cfg) return;
            var d = new Date(), tz = S.cfg.timezone || "UTC";
            a.textContent = fmtTime(d, tz, S.cfg.clock24);
            b.textContent = fmt(tz, { weekday: "long", day: "numeric", month: "long" }).format(d);
          }

          // ---------- Cards ----------

          function renderStatus(offline) {
            var s = S.status, dot = "", text;
            if (offline) { dot = "off"; text = "Can't reach the kiosk"; }
            else if (s.screen === "off") { dot = "off"; text = "Screen off"; }
            else if (!s.browser) { text = "Browser starting…"; }
            else if (s.saver) { dot = "saver"; text = "Screensaver showing"; }
            else { dot = "on"; text = "Screen on"; }
            if (S.cfg && !offline) text += " · " + profile().name;
            qs("#status").innerHTML = '<span class="dot ' + dot + '"></span><span>' + esc(text) + '</span>';
          }

          function renderProfiles() {
            var c = S.cfg;
            var chips = c.profiles.map(function (p) {
              var on = p.id === c.active;
              return '<button class="chip' + (on ? " active" : "") + '" data-action="' + (on ? "profile-manage" : "profile-switch") +
                '" data-id="' + esc(p.id) + '"' + (on ? ' aria-current="true"' : "") + '><span>' + esc(p.name) + '</span>' +
                (on ? '<span class="more">' + ic("more") + '</span>' : "") + '</button>';
            }).join("");
            qs("#profiles").innerHTML = head("layers", "Profile", "Apps, dock and screensaver are saved per profile") +
              '<div class="chips">' + chips + '<button class="chip add" data-action="profile-new">' + ic("plus") + 'New</button></div>';
          }

          function renderApps() {
            var p = profile();
            var rows = p.apps.map(function (a) {
              return '<div class="app-row" data-id="' + esc(a.id) + '">' +
                '<div class="grip" title="Drag to reorder">' + ic("grip") + '</div>' +
                '<button class="app-main" data-action="app-edit" data-id="' + esc(a.id) + '">' + tile(a) +
                '<div class="app-text"><div class="app-name"><span>' + esc(a.name) + '</span>' +
                (a.pin && S.cfg.pinSet ? ic("lock", "pinmark") : "") +
                (a.id === p.home ? '<span class="badge">Home</span>' : "") + '</div>' +
                '<div class="app-url">' + esc(prettyUrl(a.url)) + '</div></div>' + ic("chev", "chev") + '</button></div>';
            }).join("");
            qs("#apps").innerHTML = head("apps", "Apps", "Home opens when the kiosk starts. All apps are in the dock.") +
              '<div class="app-list" id="appList">' + rows + '</div>' +
              '<button class="add-row" data-action="app-add">' + ic("plus") + 'Add app</button>';
          }

          // Video links: "D - <url>" by day, "N - <url>" by night, or just "<url>" any time
          var STREAM_LINE = /^(?:([DdNn])\s*[-:|\u2013]?\s+)?(https?:\/\/\S+)$$/;
          function streamCounts(text) {
            var c = { D: 0, N: 0, any: 0, bad: 0 };
            String(text || "").split("\n").forEach(function (line) {
              line = line.trim();
              if (!line || line.charAt(0) === "#") return;
              var m = line.match(STREAM_LINE);
              if (!m) c.bad++;
              else if (m[1]) c[m[1].toUpperCase()]++;
              else c.any++;
            });
            return c;
          }
          function countText(c) {
            var parts = [];
            if (c.D) parts.push("<b>" + c.D + "</b> day");
            if (c.N) parts.push("<b>" + c.N + "</b> night");
            if (c.any) parts.push("<b>" + c.any + "</b> any time");
            if (c.bad) parts.push('<span class="warn">' + c.bad + " not understood</span>");
            return parts.length ? parts.join(" · ") : "No links yet";
          }
          function dayNightText() {
            var d = S.daynight;
            if (!d) return "";
            var when = fmtTime(new Date(d.until * 1000), S.cfg.timezone || "UTC", S.cfg.clock24);
            if (d.mode === "sun") return (d.night ? "Night" : "Day") + " in " + d.place + " now · " + (d.night ? "sunrise" : "sunset") + " at " + when;
            return (d.night ? "Night" : "Day") + " now · " + (d.night ? "day" : "night") + " list from " + when;
          }
          function renderSaver() {
            var s = profile().saver, stream = s.source === "stream", d = S.daynight;
            var fixed = !s.sun || (d && d.mode === "fixed");
            var sunDesc = !s.sun ? "Use the times below"
              : d && d.mode === "fixed" ? "Your time zone has no city to work out sunrise and sunset, so the times below are used"
              : dayNightText();
            var body = stream
              ? '<div class="streams"><label class="field-label" for="streams">Video links, one per line</label>' +
                '<textarea class="input mono" id="streams" spellcheck="false" autocomplete="off" wrap="off" placeholder="D - https://example.com/day.mov&#10;N - https://example.com/night.mov&#10;https://example.com/any-time.mp4">' +
                esc(s.streams) + '</textarea>' +
                '<div class="stream-help"><span id="streamCount">' + countText(streamCounts(s.streams)) + '</span>' +
                '<span>Start a line with D - for day or N - for night</span></div></div>' +
                toggleRow("saver.sun", "Day and night by the sun", sunDesc) +
                (fixed ? sliderRow("saver.dayStart", "Day starts at") + sliderRow("saver.nightStart", "Night starts at") +
                         (!s.sun && d ? '<p class="note">' + esc(dayNightText()) + '</p>' : "") : "")
              : sliderRow("saver.photo", "Show each slide for") +
                toggleRow("saver.collage", "Collage", "Arrange several photos on each slide. When off, one photo or video fills the screen.");
            qs("#saver").innerHTML = head("moon", "Screensaver", stream ? "Videos from the internet, by day and by night" : "Your photos and videos when nobody is using the screen", switchEl("saver.enabled", "Screensaver")) +
              '<div class="fade' + (s.enabled ? "" : " dim") + '" data-dim="saver.enabled">' +
              '<div class="seg">' +
              '<button class="seg-btn' + (stream ? "" : " on") + '" data-action="saver-source" data-v="local">' + ic("image") + 'Photos &amp; videos</button>' +
              '<button class="seg-btn' + (stream ? " on" : "") + '" data-action="saver-source" data-v="stream">' + ic("globe") + 'Video streams</button></div>' +
              sliderRow("saver.idle", "Start after") +
              body +
              toggleRow("saver.clock", "Clock", "Date and time in the corner") +
              toggleRow("saver.sound", "Video sound", "Play videos with their sound on") +
              toggleRow("saver.returnHome", "Return to the home app", "When it ends. Otherwise you're back in the app you were using.") +
              '<div class="row"><div class="grow"><div class="label">Preview</div><div class="desc">Start it on the kiosk now</div></div>' +
              '<button class="btn" data-action="saver-now">' + ic("play") + 'Start</button></div></div>';
          }

          function included(rel, inc, exc) {
            var best = false, len = -1;
            [[inc, true], [exc, false]].forEach(function (pair) {
              pair[0].forEach(function (r) {
                if ((rel === r || rel.indexOf(r + "/") === 0) && r.length > len) { best = pair[1]; len = r.length; }
              });
            });
            return best;
          }
          function folderStates(s) {
            var states = {}, total = { p: 0, v: 0 };
            function walk(n) {
              var own = included(n.path, s.include, s.exclude), parts = [];
              if (n.photos + n.videos) {
                parts.push(own ? "on" : "off");
                if (own) { total.p += n.photos; total.v += n.videos; }
              }
              n.children.forEach(function (c) { parts.push(walk(c)); });
              var st = !parts.length ? (own ? "on" : "off")
                : parts.every(function (x) { return x === "on"; }) ? "on"
                : parts.every(function (x) { return x === "off"; }) ? "off" : "mixed";
              states[n.path] = st;
              return st;
            }
            (S.tree || []).forEach(walk);
            return { states: states, total: total };
          }
          function nodeHtml(n, depth, states) {
            var kids = n.children.length, open = !!S.open[n.path], st = states[n.path];
            var counts = [];
            if (n.tp) counts.push(plural(n.tp, "photo"));
            if (n.tv) counts.push(plural(n.tv, "video"));
            var icon = depth === 0 ? ic(n.name === "Videos" ? "video" : "image", "fic root") : ic("folder", "fic");
            var html = '<div class="tnode" style="--d:' + depth + '">' +
              '<button class="twisty' + (kids ? (open ? " open" : "") : " leaf") + '" data-action="tree-open" data-path="' + esc(n.path) +
              '" aria-label="Show folders inside ' + esc(n.name) + '" aria-expanded="' + open + '">' + ic("chev") + '</button>' +
              '<button class="tlabel" data-action="tree-toggle" data-path="' + esc(n.path) + '" role="checkbox" aria-checked="' +
              (st === "on" ? "true" : st === "mixed" ? "mixed" : "false") + '">' +
              '<span class="check ' + st + '">' + ic("check", "tick") + ic("minus", "dash") + '</span>' + icon +
              '<span class="fname">' + esc(n.name) + '</span><span class="fcount">' + counts.join(" · ") + '</span></button></div>';
            if (kids && open) html += n.children.map(function (c) { return nodeHtml(c, depth + 1, states); }).join("");
            return html;
          }
          function renderFolders() {
            if (!S.cfg) return;
            var s = profile().saver, body;
            var refresh = '<button class="icon-btn' + (S.treeLoading ? " spin" : "") + '" data-action="tree-refresh" aria-label="Look for new folders" title="Look for new folders">' + ic("refresh") + '</button>';
            if (!S.tree) {
              body = '<div class="empty">Looking through your folders…</div>';
            } else if (!S.tree.length) {
              body = '<div class="empty">No photos or videos yet. Add some to the Photos or Videos folder in the Files app on your Umbrel.</div>';
            } else {
              var f = folderStates(s);
              body = '<div class="summary">' + ic("image") + '<div>Showing <b>' + plural(f.total.p, "photo") + '</b> and <b>' + plural(f.total.v, "video") + '</b></div></div>' +
                '<div class="tree">' + S.tree.map(function (n) { return nodeHtml(n, 0, f.states); }).join("") + '</div>';
            }
            var streaming = s.source === "stream";
            qs("#folders").innerHTML = head("folder", "Photos & videos", "The folders the screensaver picks from", refresh) +
              (streaming ? '<div class="summary">' + ic("globe") + '<div>This profile\'s screensaver plays <b>video streams</b>, so these folders aren\'t used.</div></div>' : "") +
              '<div class="fade' + (s.enabled && !streaming ? "" : " dim") + '" data-dim="saver.enabled">' + body + '</div>';
          }
          function toggleFolder(path) {
            var s = profile().saver;
            var on = folderStates(s).states[path] !== "on";
            function outside(r) { return !(r === path || r.indexOf(path + "/") === 0); }
            var inc = s.include.filter(outside), exc = s.exclude.filter(outside);
            // Only add a setting for this folder when it differs from the folder it sits in
            if (included(path, inc, exc) !== on) (on ? inc : exc).push(path);
            s.include = inc;
            s.exclude = exc;
            renderFolders();
            save({ profile: { saver: { include: inc, exclude: exc } } }, 500);
          }

          function renderDock() {
            var d = profile().dock;
            qs("#dock").innerHTML = head("dock", "Dock", "Swipe up from the bottom edge of the screen to switch apps", switchEl("dock.enabled", "Dock")) +
              '<div class="fade' + (d.enabled ? "" : " dim") + '" data-dim="dock.enabled">' + sliderRow("dock.timeout", "Hide when not used for") + '</div>';
          }

          function renderTime() {
            var c = S.cfg, mine = deviceTz();
            var suggest = !KIOSK && mine && mine !== c.timezone
              ? '<button class="detect" data-action="tz-set" data-tz="' + esc(mine) + '">' + ic("globe") +
                '<div class="grow"><div class="label">Use ' + esc(tzLabel(mine)) + '</div><div class="desc">The time zone of the device you\'re using now</div></div>' + ic("chev", "chev") + '</button>'
              : "";
            qs("#time").innerHTML = head("clock", "Date & time", "For the screensaver and every app on the kiosk", '<span class="tag">All profiles</span>') +
              '<button class="row first btnrow" data-action="tz-pick"><div class="grow"><div class="label">Time zone</div>' +
              (c.timezone ? "" : '<div class="desc warn">Not set, so the kiosk shows UTC</div>') + '</div>' +
              '<div class="pick"><span>' + esc(c.timezone ? tzLabel(c.timezone) : "UTC") + '</span>' + ic("chev") + '</div></button>' +
              suggest + toggleRow("g.clock24", "24-hour clock", "") +
              '<div class="time-now"><div class="big" id="nowTime"></div><div class="small" id="nowDate"></div></div>';
            tickNow();
          }

          function renderDevice() {
            var off = S.status.screen === "off";
            qs("#device").innerHTML = head("hand", "Kiosk screen", "", '<span class="tag">All profiles</span>') +
              toggleRow("g.kioskSettings", "Settings on the kiosk", "Swipe down from the top-right corner of the screen to open them. When off, settings only open from your Umbrel.", true) +
              '<div class="actions">' +
              action("home", "Go to home app", "home") +
              action("screen", off ? "Turn screen on" : "Turn screen off", "power") +
              action("reload", "Restart browser", "refresh") +
              "</div>";
          }

          function renderPin() {
            var set = S.cfg.pinSet;
            qs("#pin").innerHTML = head("lock", "PIN", set ? "Locked settings and apps ask for it before they open" : "Lock the settings or individual apps with a 6-digit PIN", '<span class="tag">All profiles</span>') +
              '<div class="row first"><div class="grow"><div class="label">PIN</div><div class="desc">' + (set ? "Set" : "Not set") + '</div></div>' +
              (set ? '<button class="btn quiet" data-action="pin-remove">' + ic("trash") + '<span>Remove</span></button>' : "") +
              '<button class="btn" data-action="pin-set">' + ic("lock") + (set ? "Change" : "Set PIN") + '</button></div>' +
              '<div class="fade' + (set ? "" : " dim") + '">' +
              toggleRow("g.pinKiosk", "Lock settings on the kiosk", "Ask for the PIN before the settings open on the screen") +
              toggleRow("g.pinUmbrel", "Lock settings in the Umbrel app", "Ask for it here too, on phones and computers") + '</div>' +
              '<p class="note">To lock an app, edit it under Apps and switch on Require PIN. Once the PIN is entered it isn\'t asked again for 5 minutes.</p>';
          }

          function render() {
            if (!S.cfg) return;
            renderPin();
            renderStatus();
            renderProfiles();
            renderApps();
            renderSaver();
            renderFolders();
            renderDock();
            renderTime();
            renderDevice();
          }

          // ---------- Switches and sliders ----------

          function flip(key, el) {
            var val = !getKey(key);
            if (key === "g.kioskSettings" && !val && KIOSK) { ACTIONS["kiosk-off-ask"](); return; }
            setKey(key, val);
            // Update in place, so the switch animates
            var sw = el.classList.contains("switch") ? el : qs(".switch", el);
            if (sw) sw.setAttribute("aria-checked", String(val));
            qsa('[data-dim="' + key + '"]').forEach(function (d) { d.classList.toggle("dim", !val); });
            if (key === "saver.sun") { renderSaver(); afterSave(function () { return load(); }); }
            if (key === "g.clock24") renderSaver();
          }

          document.addEventListener("input", function (e) {
            var el = e.target, key = el.dataset && el.dataset.slider;
            if (!key) return;
            el.style.setProperty("--fill", (el.value / el.max * 100) + "%");
            var v = qs('[data-value="' + key + '"]');
            if (v) v.textContent = fmtOf(key)(STEPS[key][+el.value]);
          });
          document.addEventListener("change", function (e) {
            var key = e.target.dataset && e.target.dataset.slider;
            if (key) setKey(key, STEPS[key][+e.target.value], 200);
            if (key === "saver.dayStart" || key === "saver.nightStart") afterSave(function () { return load(); });
          });
          document.addEventListener("pointerdown", function (e) {
            if (e.target.matches && e.target.matches("input[type=range]")) S.dragging = true;
          });
          ["pointerup", "pointercancel"].forEach(function (t) {
            document.addEventListener(t, function () { if (S.dragging && !drag) S.dragging = false; });
          });

          // ---------- Reordering apps: drag them by the handle ----------

          var drag = null;
          document.addEventListener("pointerdown", function (e) {
            var grip = e.target.closest && e.target.closest(".grip");
            if (!grip) return;
            e.preventDefault();
            var row = grip.closest(".app-row");
            drag = { row: row, list: row.parentNode, id: e.pointerId };
            grip.setPointerCapture(e.pointerId);
            row.classList.add("dragging");
            S.dragging = true;
          });
          document.addEventListener("pointermove", function (e) {
            if (!drag || e.pointerId !== drag.id) return;
            qsa(".app-row", drag.list).forEach(function (r) {
              if (r === drag.row) return;
              var b = r.getBoundingClientRect(), mid = b.top + b.height / 2;
              var after = drag.row.compareDocumentPosition(r) & Node.DOCUMENT_POSITION_FOLLOWING;
              if (after && e.clientY > mid) r.after(drag.row);
              else if (!after && e.clientY < mid) r.before(drag.row);
            });
          });
          function endDrag(e) {
            if (!drag || e.pointerId !== drag.id) return;
            drag.row.classList.remove("dragging");
            var order = qsa(".app-row", drag.list).map(function (r) { return r.dataset.id; });
            drag = null;
            S.dragging = false;
            var p = profile(), byId = {};
            p.apps.forEach(function (a) { byId[a.id] = a; });
            var apps = order.map(function (id) { return byId[id]; }).filter(Boolean);
            if (apps.length === p.apps.length && order.join() !== p.apps.map(function (a) { return a.id; }).join()) {
              p.apps = apps;
              save({ profile: { apps: apps } });
            }
          }
          document.addEventListener("pointerup", endDrag);
          document.addEventListener("pointercancel", endDrag);

          // ---------- Taps ----------

          document.addEventListener("click", function (e) {
            var t = e.target.closest && e.target.closest("[data-action],[data-toggle],[data-switch],[data-sheet-toggle]");
            if (!t) return;
            if (t.dataset.action) {
              var fn = ACTIONS[t.dataset.action];
              if (fn) fn(t, e);
            } else if (t.dataset.sheetToggle) {
              var sw = qs(".switch", t);
              if (sw && !sw.disabled) sw.setAttribute("aria-checked", String(sw.getAttribute("aria-checked") !== "true"));
            } else {
              flip(t.dataset.toggle || t.dataset.switch, t);
            }
          });

          ACTIONS["tree-open"] = function (t) {
            S.open[t.dataset.path] = !S.open[t.dataset.path];
            renderFolders();
          };
          ACTIONS["tree-toggle"] = function (t) { toggleFolder(t.dataset.path); };
          ACTIONS["tree-refresh"] = function () { loadTree(true); };
          ACTIONS["saver-source"] = function (t) {
            if (profile().saver.source === t.dataset.v) return;
            setKey("saver.source", t.dataset.v);
            renderSaver();
            renderFolders();
            afterSave(function () { return load(); });
          };
          // The link list saves itself a moment after you stop typing
          document.addEventListener("input", function (e) {
            if (e.target.id !== "streams") return;
            profile().saver.streams = e.target.value;
            qs("#streamCount").innerHTML = countText(streamCounts(e.target.value));
            save({ profile: { saver: { streams: e.target.value } } }, 1200);
          });

          // ---------- Sheets (pop-up panels) ----------

          var sheet = null;
          function openSheet(title, body, foot, opts) {
            opts = opts || {};
            qs("#sheetTitle").textContent = title;
            qs("#sheetBody").innerHTML = body;
            qs("#sheetFoot").innerHTML = foot || "";
            qs("#sheetFoot").classList.toggle("hidden", !foot);
            qs("#sheet .sheet").className = "sheet" + (opts.wide ? " wide" : "") + (opts.tall ? " tall" : "");
            qs("#sheet").hidden = false;
            qs("#sheetBody").scrollTop = 0;
            sheet = opts;
            var first = qs("#sheet [autofocus]");
            if (first) setTimeout(function () { first.focus(); }, 60);
          }
          function closeSheet() {
            if (PAD && qs("#sheet").contains(PAD.el)) PAD = null;
            qs("#sheet").hidden = true;
            sheet = null;
            hideOsk();
          }
          ACTIONS["sheet-close"] = closeSheet;
          document.addEventListener("keydown", function (e) {
            if (e.key === "Escape" && sheet) closeSheet();
            if (e.key === "Enter" && sheet && e.target.matches && e.target.matches("input.input")) {
              var go = qs("#sheetFoot .btn.primary");
              if (go) { e.preventDefault(); go.click(); }
            }
          });
          // Ask twice before anything is deleted
          function sure(btn, question) {
            if (btn.classList.contains("sure")) return true;
            btn.classList.add("sure");
            btn.innerHTML = ic("trash") + "<span>" + esc(question) + "</span>";
            return false;
          }

          // ---------- Apps ----------

          function editApp(id) {
            var p = profile(), found = p.apps.filter(function (a) { return a.id === id; })[0];
            var app = found ? clone(found) : { id: "", name: "", url: "" };
            var isHome = !!found && p.home === app.id;
            var body =
              '<label class="field"><span class="field-label">Name</span>' +
              '<input class="input" id="fName" type="text" maxlength="60" autocomplete="off" placeholder="e.g. Home Assistant" value="' + esc(app.name) + '"' + (found ? "" : " autofocus") + '></label>' +
              '<label class="field"><span class="field-label">Address</span>' +
              '<input class="input" id="fUrl" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="http://192.168.1.20:8123" value="' + esc(app.url) + '"></label>' +
              '<div class="error" id="fErr"></div>' +
              '<div class="row toggle first" data-sheet-toggle="home"><div class="grow"><div class="label">Home app</div>' +
              '<div class="desc">' + (isHome ? "Opens when the kiosk starts. Make another app home to change this." : "Open this when the kiosk starts, and after the screensaver") + '</div></div>' +
              '<button class="switch" role="switch" id="fHome" aria-label="Home app" aria-checked="' + isHome + '"' + (isHome ? " disabled" : "") + '></button></div>' +
              '<div class="row toggle' + (S.cfg.pinSet ? "" : " dim") + '" data-sheet-toggle="pin"><div class="grow"><div class="label">Require PIN</div>' +
              '<div class="desc">' + (S.cfg.pinSet ? "Ask for the PIN before this app opens on the kiosk" : "Set a PIN first, in the PIN section") + '</div></div>' +
              '<button class="switch" role="switch" id="fPin" aria-label="Require PIN" aria-checked="' + !!app.pin + '"' + (S.cfg.pinSet ? "" : " disabled") + '></button></div>' +
              (found && !KIOSK ? '<div class="row"><div class="grow"><div class="label">Show it now</div><div class="desc">Switch the kiosk to this app</div></div>' +
                '<button class="btn" data-action="app-show" data-id="' + esc(app.id) + '">' + ic("monitor") + 'Show</button></div>' : "");
            var foot = (found ? '<button class="btn danger" data-action="app-delete" data-id="' + esc(app.id) + '"' + (p.apps.length < 2 ? " disabled" : "") + '>' +
              ic("trash") + '<span>Delete</span></button>' : "") +
              '<div class="grow"></div><button class="btn primary" data-action="app-save">' + (found ? "Save" : "Add app") + '</button>';
            openSheet(found ? "Edit app" : "Add app", body, foot, { app: app, isNew: !found });
          }
          ACTIONS["app-edit"] = function (t) { editApp(t.dataset.id); };
          ACTIONS["app-add"] = function () { editApp(null); };
          ACTIONS["app-save"] = function () {
            var name = qs("#fName").value.trim(), url = qs("#fUrl").value.trim(), err = qs("#fErr");
            if (!url) { err.textContent = "Enter the address of the page to show."; return; }
            if (!/^[a-z][a-z0-9+.-]*:/i.test(url)) url = "http://" + url;
            try {
              if (!/^https?:$$/.test(new URL(url).protocol)) throw new Error();
            } catch (e) { err.textContent = "That doesn't look like a web address."; return; }
            var p = profile(), apps = clone(p.apps), home = p.home, id = sheet.app.id;
            var pin = qs("#fPin").getAttribute("aria-checked") === "true";
            name = name || hostOf(url);
            if (sheet.isNew) {
              id = newId();
              apps.push({ id: id, name: name, url: url, pin: pin });
            } else {
              apps.forEach(function (a) { if (a.id === id) { a.name = name; a.url = url; a.pin = pin; } });
            }
            if (qs("#fHome").getAttribute("aria-checked") === "true") home = id;
            p.apps = apps;
            p.home = home;
            closeSheet();
            renderApps();
            save({ profile: { apps: apps, home: home } });
            setTimeout(load, 3000);   // its icon is fetched in the background
          };
          ACTIONS["app-delete"] = function (t) {
            if (!sure(t, "Tap again to delete")) return;
            var p = profile(), id = t.dataset.id;
            p.apps = p.apps.filter(function (a) { return a.id !== id; });
            if (p.home === id) p.home = p.apps[0].id;
            closeSheet();
            renderApps();
            save({ profile: { apps: p.apps, home: p.home } });
          };
          ACTIONS["app-show"] = function (t) {
            closeSheet();
            act({ action: "open", id: t.dataset.id }, "Showing it on the kiosk");
          };

          // ---------- Profiles ----------

          function profileCall(body, message) {
            return afterSave(function () { return api("POST", "/api/profiles", body); }).then(function (cfg) {
              S.cfg = cfg;
              render();
              if (message) toast(message());
            }, function (e) { toast("Couldn't change profiles: " + e.message, true); });
          }
          ACTIONS["profile-switch"] = function (t) {
            profileCall({ action: "activate", id: t.dataset.id }, function () { return "Switched to " + profile().name; });
          };
          ACTIONS["profile-new"] = function () {
            openSheet("New profile",
              '<label class="field"><span class="field-label">Name</span>' +
              '<input class="input" id="fProfile" type="text" maxlength="40" autocomplete="off" placeholder="e.g. Evening" autofocus></label>' +
              '<p class="note">It starts as a copy of “' + esc(profile().name) + '” and becomes the active profile. Then change anything you like.</p>',
              '<div class="grow"></div><button class="btn primary" data-action="profile-create">Create profile</button>');
          };
          ACTIONS["profile-create"] = function () {
            var name = qs("#fProfile").value.trim();
            closeSheet();
            profileCall({ action: "create", name: name }, function () { return "Created " + profile().name; });
          };
          ACTIONS["profile-manage"] = function () {
            var p = profile(), only = S.cfg.profiles.length < 2;
            openSheet("Profile",
              '<label class="field"><span class="field-label">Name</span>' +
              '<input class="input" id="fProfile" type="text" maxlength="40" autocomplete="off" value="' + esc(p.name) + '"></label>' +
              '<p class="note">' + (only
                ? "Profiles let you keep different setups, like a daytime dashboard and an evening photo frame, and switch between them with one tap."
                : "Switch profiles by tapping their names at the top of the settings.") + '</p>',
              '<button class="btn danger" data-action="profile-delete"' + (only ? " disabled" : "") + '>' + ic("trash") + '<span>Delete</span></button>' +
              '<div class="grow"></div><button class="btn primary" data-action="profile-rename">Save</button>');
          };
          ACTIONS["profile-rename"] = function () {
            var name = qs("#fProfile").value.trim();
            closeSheet();
            if (name && name !== profile().name) profileCall({ action: "rename", id: profile().id, name: name }, function () { return "Saved"; });
          };
          ACTIONS["profile-delete"] = function (t) {
            if (!sure(t, "Tap again to delete")) return;
            var name = profile().name;
            closeSheet();
            profileCall({ action: "delete", id: profile().id }, function () { return "Deleted " + name; });
          };

          // ---------- Time zone ----------

          var REGIONS = ["Europe", "America", "Asia", "Africa", "Australia", "Pacific", "Atlantic", "Indian", "Antarctica", "Other"];
          var COMMON = ["UTC", "Europe/London", "Europe/Dublin", "Europe/Lisbon", "Europe/Paris", "Europe/Berlin", "Europe/Amsterdam",
            "Europe/Brussels", "Europe/Madrid", "Europe/Rome", "Europe/Zurich", "Europe/Vienna", "Europe/Prague", "Europe/Warsaw",
            "Europe/Stockholm", "Europe/Oslo", "Europe/Copenhagen", "Europe/Helsinki", "Europe/Athens", "Europe/Bucharest",
            "Europe/Istanbul", "Europe/Kyiv", "Europe/Moscow", "America/New_York", "America/Chicago", "America/Denver",
            "America/Phoenix", "America/Los_Angeles", "America/Anchorage", "America/Toronto", "America/Vancouver",
            "America/Mexico_City", "America/Bogota", "America/Lima", "America/Santiago", "America/Sao_Paulo",
            "America/Argentina/Buenos_Aires", "Pacific/Honolulu", "Asia/Dubai", "Asia/Karachi", "Asia/Kolkata", "Asia/Dhaka",
            "Asia/Bangkok", "Asia/Jakarta", "Asia/Singapore", "Asia/Hong_Kong", "Asia/Shanghai", "Asia/Taipei", "Asia/Manila",
            "Asia/Seoul", "Asia/Tokyo", "Asia/Jerusalem", "Africa/Cairo", "Africa/Lagos", "Africa/Nairobi", "Africa/Johannesburg",
            "Australia/Perth", "Australia/Adelaide", "Australia/Brisbane", "Australia/Sydney", "Australia/Melbourne",
            "Pacific/Auckland", "Atlantic/Reykjavik", "Atlantic/Azores", "Indian/Maldives", "Indian/Mauritius"];
