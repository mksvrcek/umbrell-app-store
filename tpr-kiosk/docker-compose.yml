        #!/usr/bin/python3

        """Screen saver: opens the slideshow over an idle app and closes it on
        any input.

        Input comes from the touch screen (libinput) and from inside the
        browser, so the

        remote view counts as well."""

        import glob, os, sys, time


        sys.path.insert(0, "/usr/local/lib/kiosk")

        import kioskconf as K


        NOW = "/tmp/saver-now"   # "Preview" on the settings page



        def last_input():
            try:
                return os.path.getmtime(K.LAST_INPUT)
            except OSError:
                return time.time()

        def blanked():
            return os.path.exists("/tmp/blank")

        def sound_playing():
            for f in glob.glob("/proc/asound/card*/pcm*p/sub*/status"):
                try:
                    if "RUNNING" in open(f).read():
                        return True
                except OSError:
                    pass
            return False

        def dismiss(cfg, tabs, savers, return_to, go_back):
            p = K.profile(cfg)
            home = K.home_app(cfg)
            rest = [t for t in tabs if t not in savers]
            target = None
            if go_back and return_to:
                target = next((t for t in rest if t["id"] == return_to), None)
            if target is None:
                target = next((t for t in rest if K.app_for(t.get("url"), [home])), None)
            if target:
                K.activate(target["id"])
            else:
                target = K.open_tab(home["url"]) or {}
            # Close the screen saver, and any other site left open behind it (apps stay loaded)
            for t in tabs:
                url = t.get("url")
                if t["id"] != target.get("id") and (t in savers or not (K.app_for(url, p["apps"]) or K.is_settings(url))):
                    K.close_tab(t["id"])


        opened = 0

        busy_until = 0

        first = True        # show the screen saver as soon as the app starts

        showing = False

        preview = False

        return_to = None


        while True:
            time.sleep(0.2 if showing else 1)
            try:
                cfg = K.load()
                s = K.profile(cfg)["saver"]
                tabs = K.pages()
                savers = [t for t in tabs if K.is_saver(t.get("url"))]
                showing = bool(savers)

                if savers:
                    # Any tap, click or key (on the screen or from the remote view): back to the app
                    if last_input() > opened or blanked() or not (s["enabled"] or preview):
                        dismiss(cfg, tabs, savers, return_to, preview or not s["returnHome"])
                        busy_until = time.time()
                        preview = False
                    continue
                preview = False

                if os.path.exists(NOW):
                    os.remove(NOW)
                    if tabs and not blanked():
                        return_to = tabs[0]["id"]
                        K.open_tab(K.SAVER_URL)
                        opened = time.time()
                        preview = showing = True
                    continue

                if not tabs:
                    continue
                if not s["enabled"] or blanked():
                    first = False
                    continue
                # Only over one of the apps: not while YouTube, another site or the settings are on screen
                if not K.app_for(tabs[0].get("url"), K.profile(cfg)["apps"]):
                    busy_until = time.time()
                    first = False
                    continue
                # Music or a video with sound counts as activity
                if not first and sound_playing():
                    busy_until = time.time()
                    continue
                if first or time.time() - max(last_input(), busy_until) >= s["idle"]:
                    first = False
                    return_to = tabs[0]["id"]
                    K.open_tab(K.SAVER_URL)
                    opened = time.time()
            except Exception:
                # The browser may be restarting; try again shortly
                time.sleep(2)
        EOS

