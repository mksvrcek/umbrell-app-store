description: >-
  Turns the screen plugged into your Umbrel into a full-screen kiosk, with a
  photo and video screensaver from your Photos and Videos folders.
  Opening the app shows its settings, where you choose the pages to show,
  the screensaver's folders and timings, and the time zone, and save it all as
  profiles. On the screen itself, swipe down from the top-right corner for the
  settings and up from the bottom edge for a dock of your apps.
