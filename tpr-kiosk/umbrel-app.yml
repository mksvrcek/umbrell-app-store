releaseNotes: >-
  New settings page (opens from the Umbrel home screen, and on the kiosk by
  swiping down from the top-right corner) with profiles, several apps in a
  swipe-up dock, screensaver folders and timings, and a time zone setting.
  The screensaver now loads the next slide in the background so it fades
  straight in, and the remote view counts as activity: it closes the
  screensaver and keeps it away while you use it. Home Assistant can switch
  profiles and control the screen and screensaver over HTTP, with an optional
  Home Assistant integration (see the home-assistant folder). An optional
  6-digit PIN can lock the settings (on the kiosk, in the Umbrel app, or both)
  and individual apps. The screensaver can also play a list of video links,
  with separate day and night lists that follow sunrise and sunset.
