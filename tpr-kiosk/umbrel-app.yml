name: HDMI Kiosk
tagline: Show any web page full-screen on the Pi's HDMI display
icon: https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTKxd9Kwk7SC7i0czOdyZSKVuWYef3CDDV6d7W53NZK4w&s
